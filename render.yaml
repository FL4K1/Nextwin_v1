services:
  - type: web
    name: nexttwin-api
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py migrate"
    startCommand: "daphne -b 0.0.0.0 -p $PORT medgenie.asgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexttwin-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com"
      - key: AI_ENGINE_URL
        value: "http://nexttwin-ai-engine:10000"

  - type: web
    name: nexttwin-ai-engine
    env: python
    rootDir: ai_engine
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: AI_ENGINE_PORT
        value: "10000"

databases:
  - name: nexttwin-db
    plan: free
