services:
  - type: web
    name: nexttwin-api
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py migrate"
    startCommand: "daphne -b 0.0.0.0 -p $PORT medgenie.asgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: "medgenie.settings"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,https://nextwin-v1.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.vercel.app,https://*.onrender.com"
      - key: AI_ENGINE_URL
        value: "https://nexttwin-ai-engine.onrender.com"
      - key: AI_ENGINE_INTERNAL_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: nexttwin-ai-engine
    env: python
    rootDir: ai_engine
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: AI_ENGINE_PORT
        value: "10000"
      - key: AI_ENGINE_SECRET_KEY
        fromService:
          name: nexttwin-api
          type: web
          envVarKey: AI_ENGINE_INTERNAL_TOKEN
